<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AutoSport - Registro</title>
</head>
<body>

    <header>
        <h1>AutoSport Colombia</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Apartar / Comprar Auto</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="nosotros.html">Quiénes Somos</a></li>

            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Registro de Cliente</h2>

        <form action="#" method="post">
            <p>
                <label for="nombre">Nombre completo:</label><br>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
            </p>

            <p>
                <label for="correo">Correo electrónico:</label><br>
                <input type="email" id="correo" name="email" placeholder="ejemplo@correo.com" required>
            </p>

            <!-- AQUÍ AGREGAMOS EL SELECT DE LA CIUDAD -->
            <p>
                <label for="ciudad">Ciudad:</label><br>
                <select id="ciudad" name="ciudad_usuario">
                    <option value="giron">Girón</option>
                    <option value="bucaramanga">Bucaramanga</option>
                    <option value="bogota">Bogotá D.C.</option>
                    <option value="medellin">Medellín</option>
                    <option value="cali">Cali</option>
                </select>
            </p>
            <!-- FIN DEL SELECT -->

            <p>
                <label for="password">Contraseña:</label><br>
                <input type="password" id="password" name="password" required>
            </p>

            <hr>
            <button type="submit">Registrarse</button>
        </form>
    </main>

</body>
</html>
